[dependency-groups]
dev = [
  "import-linter>=2.7,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
]

[tool.uv.workspace]
members = ["core"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "strict"
testpaths = ["core/tests"]

[tool.ruff]
line-length = 88
src = ["core/src", "core/tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "TID", "UP"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
fastapi.msg = "HTTP framework concerns belong outside dutchmate_core."
httpx.msg = "HTTP client concerns belong outside dutchmate_core."
mcp.msg = "MCP belongs to its later delivery adapter, not dutchmate_core."
requests.msg = "HTTP client concerns belong outside dutchmate_core."
serial.msg = "Serial-library types must stay behind the backend boundary."
subprocess.msg = "Product code must not execute external programs."
typer.msg = "CLI framework concerns belong outside dutchmate_core."

[tool.ruff.lint.per-file-ignores]
"core/tests/**/*.py" = ["TID251"]

[tool.mypy]
files = ["core/src", "core/tests"]
mypy_path = ["core/src"]
python_version = "3.14"
strict = true

[tool.importlinter]
include_external_packages = true
root_package = "dutchmate_core"

[[tool.importlinter.contracts]]
name = "Core does not depend on test frameworks"
type = "forbidden"
source_modules = ["dutchmate_core"]
forbidden_modules = ["pytest", "pytest_asyncio"]

[[tool.importlinter.contracts]]
name = "Core module dependencies point inward"
type = "layers"
layers = [
  "dutchmate_core.acquisition",
  "dutchmate_core.backend | dutchmate_core.evidence",
  "dutchmate_core.model",
]
