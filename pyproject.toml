[dependency-groups]
dev = [
  "import-linter>=2.7,<3",
  "mypy>=1.15,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.25,<2",
  "ruff>=0.11,<1",
  "types-pyserial==3.5.0.20260712",
]

[tool.uv.workspace]
members = ["core", "apps/service", "apps/cli"]

[tool.pytest.ini_options]
addopts = ["--strict-config", "--strict-markers", "-ra"]
asyncio_mode = "strict"
testpaths = ["core/tests", "apps/service/tests", "apps/cli/tests"]

[tool.ruff]
line-length = 88
src = ["core/src", "core/tests"]
target-version = "py314"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "TID", "UP"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
fastapi.msg = "HTTP framework concerns belong outside dutchmate_core."
httpx.msg = "HTTP client concerns belong outside dutchmate_core."
mcp.msg = "MCP belongs to its later delivery adapter, not dutchmate_core."
requests.msg = "HTTP client concerns belong outside dutchmate_core."
serial.msg = "Serial-library types must stay behind the backend boundary."
subprocess.msg = "Product code must not execute external programs."
typer.msg = "CLI framework concerns belong outside dutchmate_core."

[tool.ruff.lint.per-file-ignores]
"core/src/dutchmate_core/adapters/basic_serial.py" = ["TID251"]
"core/tests/**/*.py" = ["TID251"]

[tool.mypy]
files = [
  "core/src", "core/tests",
  "apps/service/src", "apps/service/tests",
  "apps/cli/src", "apps/cli/tests",
]
# Keep existing test imports while distinguishing the two unpackaged conftests.
explicit_package_bases = true
mypy_path = [
  "core/src", "core",
  "apps/service/src", "apps/service/tests",
  "apps/cli/src",
]
python_version = "3.14"
strict = true

[tool.importlinter]
include_external_packages = true
root_packages = ["dutchmate_core", "dutchmate_service", "dutchmate_cli"]

[[tool.importlinter.contracts]]
name = "Core does not depend on test frameworks"
type = "forbidden"
source_modules = ["dutchmate_core"]
forbidden_modules = ["pytest", "pytest_asyncio"]

[[tool.importlinter.contracts]]
name = "Core module dependencies point inward"
type = "layers"
layers = [
  "dutchmate_core.runtime : dutchmate_core.evidence_access",
  "dutchmate_core.annotation",
  "dutchmate_core.monitor",
  "dutchmate_core.acquisition",
  "dutchmate_core.backend | dutchmate_core.evidence",
  "dutchmate_core.model",
]

[[tool.importlinter.contracts]]
name = "Shared Core does not depend on adapters"
type = "forbidden"
source_modules = [
  "dutchmate_core.runtime",
  "dutchmate_core.annotation",
  "dutchmate_core.monitor",
  "dutchmate_core.evidence_access",
  "dutchmate_core.acquisition",
  "dutchmate_core.backend",
  "dutchmate_core.evidence",
  "dutchmate_core.model",
  "dutchmate_core.profile",
]
forbidden_modules = ["dutchmate_core.adapters"]

[[tool.importlinter.contracts]]
name = "Core does not depend on service or CLI delivery"
type = "forbidden"
source_modules = ["dutchmate_core"]
forbidden_modules = ["dutchmate_service", "dutchmate_cli"]

[[tool.importlinter.contracts]]
name = "Service does not directly import hardware or deferred clients"
type = "forbidden"
source_modules = ["dutchmate_service"]
forbidden_modules = ["serial", "subprocess", "mcp", "typer", "requests", "httpx", "dutchmate_cli"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "CLI does not depend on Core or service implementation"
type = "forbidden"
source_modules = ["dutchmate_cli"]
forbidden_modules = ["dutchmate_core", "dutchmate_service"]

[[tool.importlinter.contracts]]
name = "CLI does not directly import hardware, storage, servers or deferred adapters"
type = "forbidden"
source_modules = ["dutchmate_cli"]
forbidden_modules = ["serial", "sqlite3", "fastapi", "uvicorn", "mcp", "subprocess"]
allow_indirect_imports = true
