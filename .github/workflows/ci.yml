name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.10.2"

defaults:
  run:
    shell: bash

jobs:
  static:
    name: Static validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            .python-version
            uv.lock
            **/pyproject.toml
      - name: Install Python from .python-version
        run: uv python install
      - name: Synchronize locked workspace and development dependencies
        run: uv sync --locked --all-packages
      - name: Record static environment
        id: environment
        run: |
          uv run --frozen --no-sync python tools/ci_acceptance.py snapshot static
          { uv --version; uname -a; gcc --version; ld --version; ldd --version; } \
            2>&1 | tee build/ci/static-toolchain.txt
      - name: Ruff
        id: ruff
        run: uv run --frozen --no-sync ruff check . 2>&1 | tee build/ci/ruff.log
      - name: mypy
        id: mypy
        if: ${{ !cancelled() }}
        run: uv run --frozen --no-sync mypy . 2>&1 | tee build/ci/mypy.log
      - name: Import contracts
        id: imports
        if: ${{ !cancelled() }}
        run: uv run --frozen --no-sync lint-imports 2>&1 | tee build/ci/imports.log
      - name: Whitespace validation
        id: diff
        if: ${{ !cancelled() }}
        run: git diff --check
      - name: Static evidence report
        if: ${{ !cancelled() }}
        run: |
          uv run --frozen --no-sync python tools/ci_acceptance.py report static \
            environment=${{ steps.environment.outcome }} ruff=${{ steps.ruff.outcome }} \
            mypy=${{ steps.mypy.outcome }} imports=${{ steps.imports.outcome }} \
            diff=${{ steps.diff.outcome }}
      - name: Upload static evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-static-evidence
          path: |
            build/ci/static-environment.json
            build/ci/static-toolchain.txt
            build/ci/static-report.json
            build/ci/ruff.log
            build/ci/mypy.log
            build/ci/imports.log
          if-no-files-found: warn
          retention-days: 14

  tests:
    name: Software tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
          cache-suffix: ${{ github.job }}
          cache-dependency-glob: |
            .python-version
            uv.lock
            **/pyproject.toml
      - name: Install Python from .python-version
        run: uv python install
      # Building all workspace members also caches the declared Hatchling backend
      # used by the installed-process tests' offline wheel/sdist builds.
      - name: Synchronize locked workspace and development dependencies
        run: uv sync --locked --all-packages
      - name: Record test environment
        id: environment
        run: |
          uv run --frozen --no-sync python tools/ci_acceptance.py snapshot tests
          { uv --version; uname -a; gcc --version; ld --version; ldd --version; } \
            2>&1 | tee build/ci/tests-toolchain.txt
      - name: Run complete hardware-free default suite
        id: pytest
        timeout-minutes: 45
        # Existing parent/child guards forbid physical serial/discovery and real
        # service-account access. Do not supply a device/Profile or filter tests.
        # Explicit bash above enables pipefail, preserving pytest's failure code.
        run: |
          uv run --frozen --no-sync python tools/ci_acceptance.py test tests \
            2>&1 | tee build/ci/pytest.log
      - name: Verify acceptance reporter fails closed
        id: reporter
        if: ${{ !cancelled() }}
        run: |
          uv run --frozen --no-sync python -m pytest -q -W error \
            tools/test_ci_acceptance.py --junitxml=build/ci/reporter.xml \
            2>&1 | tee build/ci/reporter.log
      - name: Linux acceptance evidence report
        if: ${{ !cancelled() }}
        run: |
          uv run --frozen --no-sync python tools/ci_acceptance.py report tests \
            environment=${{ steps.environment.outcome }} pytest=${{ steps.pytest.outcome }} \
            reporter=${{ steps.reporter.outcome }}
      - name: Upload test and installed-artifact acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-software-acceptance-evidence
          # Never upload pytest temporary homes, credentials, journals or caches.
          path: |
            build/ci/pytest.xml
            build/ci/pytest.log
            build/ci/reporter.xml
            build/ci/reporter.log
            build/ci/tests-environment.json
            build/ci/tests-toolchain.txt
            build/ci/tests-report.json
            build/ci/installed-artifacts.json
            build/ci/packages/*.whl
            build/ci/packages/*.tar.gz
          if-no-files-found: warn
          retention-days: 14
