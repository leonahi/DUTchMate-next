line-length = 88
src = ["src", "tests"]
target-version = "py314"

[lint]
select = ["B", "E4", "E7", "E9", "F", "I", "TID", "UP"]

[lint.flake8-tidy-imports.banned-api]
dutchmate_core.msg = "CLI delivery uses HTTP, never Core implementation."
dutchmate_service.msg = "CLI delivery uses HTTP, never service implementation."
serial.msg = "CLI product code must not access physical transports."
sqlite3.msg = "CLI product code must not access evidence storage."
fastapi.msg = "HTTP server concerns belong outside CLI delivery."
uvicorn.msg = "CLI product code must not run the service."
mcp.msg = "MCP remains a later delivery adapter."
subprocess.msg = "CLI product code must not execute external programs."

[lint.per-file-ignores]
"tests/**/*.py" = ["TID251"]
