line-length = 88
src = ["src", "tests"]
target-version = "py314"

[lint]
select = ["B", "E4", "E7", "E9", "F", "I", "TID", "UP"]

[lint.flake8-tidy-imports.banned-api]
serial.msg = "The service uses the existing Core composition, never serial APIs."
subprocess.msg = "Service product code must not execute external programs."
mcp.msg = "MCP remains a later delivery adapter."
typer.msg = "The DUT CLI remains deferred."
requests.msg = "Client delivery does not belong in the service."
httpx.msg = "HTTP client dependencies are test tooling only."

[lint.per-file-ignores]
"tests/**/*.py" = ["TID251"]
